<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eadb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>어제 몇 병이나 마신 거야?</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4eadb;color:#302219;font-family:system-ui,"Noto Sans KR",sans-serif}.app{max-width:1180px;margin:auto;padding:16px}h1{text-align:center;font-size:clamp(29px,5vw,54px);margin:4px}.sub{text-align:center;color:#76695f;margin-bottom:15px}.layout{display:grid;grid-template-columns:2.15fr 1fr;gap:14px}.card{background:#fffaf1;border:1px solid #ded0bb;border-radius:18px;box-shadow:0 8px 25px #54351518}.calendar{padding:14px}.monthrow{display:flex;justify-content:center;align-items:center;gap:15px}.month{font-size:27px;font-weight:800}.nav{border:0;background:#f3e4ce;border-radius:50%;width:38px;height:38px;font-size:22px}.selectedDate{text-align:center;margin:6px;color:#8b684a;font-weight:750}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{text-align:center;padding:7px;border-bottom:1px solid #ddd}.day{min-width:0;height:112px;padding:4px;border-right:1px solid #e4d9ca;border-bottom:1px solid #e4d9ca;overflow:hidden;cursor:pointer}.day:nth-child(7n){border-right:0}.day.other{opacity:.32}.day.selected{background:#f3dfbd;box-shadow:inset 0 0 0 3px #9d7550}.num{font-size:12px}.icons{height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden}.drinkGroup{display:flex;align-items:center;white-space:nowrap}.drinkIcon{font-size:18px;line-height:1}.boom{font-size:14px;font-weight:900}.side{display:flex;flex-direction:column;gap:13px}.side>.card{padding:14px}.faces{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.face{display:flex;justify-content:space-between;padding:6px 8px;border-radius:10px;cursor:pointer}.face.active{background:#f3dfbd;box-shadow:inset 0 0 0 2px #9d7550}.message{display:flex;gap:11px;align-items:center}.message .emoji{font-size:58px}.green{font-size:25px;font-weight:800;color:#176f52}.progress{height:12px;border-radius:9px;background:#e7dccb;overflow:hidden}.bar{height:100%;background:#6d9e7b}.picker{margin-top:14px;padding:13px}.choices{display:flex;gap:8px;overflow:auto;padding-top:9px}.choice{flex:0 0 104px;padding:9px 4px;text-align:center;background:#fff;border:1px solid #dfd1bd;border-radius:13px;cursor:pointer}.art{height:48px;display:flex;align-items:center;justify-content:center;font-size:37px}.label{font-size:13px;font-weight:650}.tools{display:flex;gap:7px;margin-top:10px;justify-content:center}.tools button,.editbtn{border:1px solid #d7c4a8;background:#fff;border-radius:10px;padding:8px 11px}.brand{text-align:center;padding:16px;color:#6e5949;letter-spacing:2px}.modal,.flash{position:fixed;inset:0;background:#30251bbb;display:none;align-items:center;justify-content:center;z-index:20}.box{background:#fff9ef;padding:22px;border-radius:22px;min-width:290px;text-align:center}.qtys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.qtys button{padding:11px;border:1px solid #d7c4a8;background:#fff;border-radius:11px;font-size:18px}.flash{z-index:30;background:#f7e8cef5;flex-direction:column}.flash .f{font-size:min(50vw,300px)}.flash .t{font-size:30px;font-weight:850}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:contents}.calendar{grid-row:1}.faceCard{grid-row:2}.goalCard{grid-row:3}.message{grid-row:4}.faces{display:flex;overflow-x:auto}.face{flex:0 0 70px;flex-direction:column;align-items:center}.day{height:96px}.icons{height:72px}.drinkIcon{font-size:15px}.boom{font-size:12px}.num{font-size:11px}}
</style></head><body><div class="app"><h1>어제 몇 병이나 마신 거야?</h1><div class="sub">기록은 솔직하게, 내일은 더 가볍게.</div>
<div class="layout"><div class="card calendar"><div class="monthrow"><button class="nav" onclick="moveMonth(-1)">‹</button><div class="month" id="month"></div><button class="nav" onclick="moveMonth(1)">›</button></div><div class="selectedDate" id="selectedDate"></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div><div class="tools"><button onclick="deleteDay()">선택일 기록 삭제</button></div></div>
<div class="side"><div class="card goalCard"><b>🚩 내 목표</b><h2 id="goalTitle"></h2><div id="rewardText"></div><br><div class="progress"><div class="bar" id="bar"></div></div><div id="progress" style="text-align:right"></div><div class="tools"><button onclick="editGoal()">목표/보상 수정</button></div></div>
<div class="card faceCard"><h3>👑 이번 달 내 얼굴 컬렉션</h3><div class="faces" id="faces"></div></div>
<div class="card message"><div class="emoji" id="msgFace">🙂</div><div><div class="green" id="msgTitle">기록해볼까요?</div><b id="msgText"></b></div></div></div></div>
<div class="card picker"><b>선택한 날짜에 마신 술을 기록하세요.</b><div class="choices" id="choices"></div></div><div class="brand">SOCRA × Tess</div></div>
<div class="modal" id="modal"><div class="box"><div id="selArt" style="font-size:58px"></div><h2 id="selName"></h2><div>마신 수량을 선택하세요</div><div class="qtys" id="qtys"></div><div class="tools"><button onclick="modal.style.display='none'">취소</button></div></div></div>
<div class="flash" id="flash"><div class="f" id="ff">🙂</div><div class="t" id="ft"></div></div>
<script>
const defaultDrinks=[{id:'beerGlass',name:'맥주(잔)',icon:'🍺'},{id:'beerBottle',name:'맥주(병)',icon:'🍾'},{id:'soju',name:'소주',icon:'🍶'},{id:'mak',name:'막걸리',icon:'🏺'},{id:'wine',name:'와인',icon:'🍷'},{id:'whisky',name:'위스키',icon:'🥃'}];
let records=JSON.parse(localStorage.getItem('socraDrinkRecords')||'{}'),custom=JSON.parse(localStorage.getItem('socraDrinkCustom')||'[]'),settings=JSON.parse(localStorage.getItem('socraDrinkSettings')||'{"dryGoal":20,"reward":"새 운동화 구입!"}');
let selectedDrink=null;const now=new Date();let yday=new Date(now);yday.setDate(now.getDate()-1);let viewY=yday.getFullYear(),viewM=yday.getMonth(),selectedDay=yday.getDate();
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function mk(cls,html){let e=document.createElement('div');e.className=cls;e.innerHTML=html;return e}
function renderChoices(){choices.innerHTML='';let dry=mk('choice','<div class="art">🚫</div><div class="label">안 마셨어요<br>(금주)</div>');dry.onclick=saveDry;choices.appendChild(dry);[...defaultDrinks,...custom].forEach(d=>{let x=mk('choice',`<div class="art">${d.icon}</div><div class="label">${d.name}</div>`);x.onclick=()=>choose(d);choices.appendChild(x)});let o=mk('choice','<div class="art">➕</div><div class="label">기타</div>');o.onclick=addCustom;choices.appendChild(o)}
function choose(d){selectedDrink=d;selArt.textContent=d.icon;selName.textContent=d.name;qtys.innerHTML='';for(let n=1;n<=8;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>addQty(n);qtys.appendChild(b)}modal.style.display='flex'}
function addQty(n){let k=key(viewY,viewM,selectedDay),r=records[k]||{items:[],dry:false};if(r.dry)r={items:[],dry:false};let x=r.items.find(i=>i.id===selectedDrink.id);if(x)x.qty+=n;else r.items.push({...selectedDrink,qty:n});let total=r.items.reduce((s,i)=>s+i.qty,0);r.face=total>=5?'😱':total>=3?'😮':'🙂';records[k]=r;save();modal.style.display='none';showFlash(r.face,total>=5?'어제 도대체 몇 병이나 마신 거야? 💥':'기록했어요!')}
function saveDry(){records[key(viewY,viewM,selectedDay)]={items:[],dry:true,face:'😁'};save();showFlash('😁','최고예요!')}
function addCustom(){let name=prompt('자주 마시는 술 이름');if(!name)return;let icon=prompt('대표 이모지','🍸')||'🍸';custom.push({id:'c'+Date.now(),name,icon});localStorage.setItem('socraDrinkCustom',JSON.stringify(custom));renderChoices()}
function editGoal(){let g=parseInt(prompt('한 달 금주 목표 일수',settings.dryGoal));if(!g||g<1||g>31)return;let r=prompt('달성하면 나에게 줄 보상',settings.reward);settings={dryGoal:g,reward:r||''};localStorage.setItem('socraDrinkSettings',JSON.stringify(settings));render()}
function deleteDay(){let k=key(viewY,viewM,selectedDay);if(records[k]&&confirm(`${viewM+1}월 ${selectedDay}일 기록을 삭제할까요?`)){delete records[k];save()}}
function save(){localStorage.setItem('socraDrinkRecords',JSON.stringify(records));render()}
function moveMonth(n){viewM+=n;if(viewM<0){viewM=11;viewY--}if(viewM>11){viewM=0;viewY++}selectedDay=1;render()}
function render(){month.textContent=`${viewY}년 ${viewM+1}월`;selectedDate.textContent=`${viewM+1}월 ${selectedDay}일 선택됨`;days.innerHTML='';let first=new Date(viewY,viewM,1),start=new Date(viewY,viewM,1-first.getDay());for(let i=0;i<42;i++){let dt=new Date(start);dt.setDate(start.getDate()+i);let current=dt.getMonth()===viewM,d=dt.getDate(),k=key(dt.getFullYear(),dt.getMonth(),d),r=records[k];let e=mk('day'+(current?'':' other')+(current&&d===selectedDay?' selected':''),`<div class="num">${d}</div><div class="icons"></div>`);if(current)e.onclick=()=>{selectedDay=d;render()};if(r&&!r.dry){let box=e.querySelector('.icons');r.items.forEach(it=>{let g=document.createElement('div');g.className='drinkGroup';for(let j=0;j<Math.min(3,it.qty);j++){let s=document.createElement('span');s.className='drinkIcon';s.textContent=it.icon;g.appendChild(s)}if(it.qty>3){let p=document.createElement('span');p.className='boom';p.textContent='+💥';g.appendChild(p)}box.appendChild(g)})}days.appendChild(e)}
faces.innerHTML='';let dry=0,prefix=`${viewY}-${String(viewM+1).padStart(2,'0')}-`;Object.keys(records).filter(k=>k.startsWith(prefix)).sort().forEach(k=>{let r=records[k],d=Number(k.slice(-2));if(r.dry)dry++;let f=mk('face'+(d===selectedDay?' active':''),`<span>${viewM+1}/${d}</span><span>${r.face}</span>`);f.onclick=()=>{selectedDay=d;render()};faces.appendChild(f)});goalTitle.textContent=`금주 ${settings.dryGoal}일 달성하기!`;rewardText.textContent=`달성하면 ${settings.reward}`;bar.style.width=Math.min(100,dry/settings.dryGoal*100)+'%';progress.textContent=`${dry} / ${settings.dryGoal}일`;
let rr=records[key(viewY,viewM,selectedDay)];if(!rr){msgFace.textContent='🙂';msgTitle.textContent='기록해볼까요?';msgText.textContent=`${viewM+1}월 ${selectedDay}일 기록이 아직 없어요.`}else if(rr.dry){let streak=1,dt=new Date(viewY,viewM,selectedDay);while(true){dt.setDate(dt.getDate()-1);let pr=records[key(dt.getFullYear(),dt.getMonth(),dt.getDate())];if(pr&&pr.dry)streak++;else break}msgFace.textContent='😁';msgTitle.textContent='최고예요!';msgText.textContent=`${streak}일 연속 안 마셨어요!`}else{let total=rr.items.reduce((s,i)=>s+i.qty,0);msgFace.textContent=rr.face;msgTitle.textContent=total>=5?'어제 도대체 몇 병이나 마신 거야?':'기록했어요!';msgText.textContent=rr.items.map(i=>`${i.name} ${i.qty}`).join(' · ')}}
function showFlash(face,text){ff.textContent=face;ft.textContent=text;flash.style.display='flex';setTimeout(()=>flash.style.display='none',800)}
renderChoices();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8A6345">
  <meta name="description" content="매일 마신 술을 달력에 간단히 기록하는 개인용 앱">
  <title>어제 몇 병이나 마신 거야?</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="몇 병?">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desk">
    <header class="masthead">
      <h1>어제 몇 병이나 마신 거야?</h1>
      <button type="button" class="goal-open" data-open-goals>목표 · 보상</button>
    </header>

    <div class="layout">
      <main class="main">
        <!-- 탁상 달력 -->
        <section class="calendar" aria-label="월간 달력">
          <div class="rings" aria-hidden="true"></div>
          <div class="cal-head">
            <button type="button" class="nav" id="prevMonth" aria-label="이전 달">‹</button>
            <h2 class="month-title" id="monthTitle"></h2>
            <button type="button" class="nav" id="nextMonth" aria-label="다음 달">›</button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
          </div>
          <div class="grid" id="grid"></div>
        </section>

        <!-- 얼굴 컬렉션 (모바일: 달력 바로 아래 가로 스크롤) -->
        <section class="faces faces--mobile" aria-label="이번 달 내 얼굴 컬렉션">
          <h3>이번 달 내 얼굴 컬렉션</h3>
          <div class="face-list" data-face-list></div>
        </section>

        <!-- 선택한 날짜 기록 -->
        <section class="record" aria-label="선택한 날짜 기록">
          <div class="record-head">
            <h2 id="recordTitle"></h2>
            <span class="record-tag" id="recordTag"></span>
          </div>

          <button type="button" class="sober-btn" id="soberBtn">안 마셨어요 (금주)</button>

          <p class="or">마셨다면, 술을 고르고 수량을 정해 주세요</p>
          <div class="drinks" id="drinks"></div>

          <div class="stepper" id="stepper" hidden>
            <span class="stepper-name" id="stepperName"></span>
            <div class="stepper-ctrl">
              <button type="button" id="minus" aria-label="하나 빼기">−</button>
              <output id="qty" aria-live="polite">0</output>
              <button type="button" id="plus" aria-label="하나 더하기">+</button>
            </div>
            <span class="stepper-unit" id="stepperUnit"></span>
          </div>

          <p class="draft-summary" id="draftSummary"></p>

          <div class="actions">
            <button type="button" class="save-btn" id="saveBtn">기록하기</button>
            <button type="button" class="delete-btn" id="deleteBtn" hidden>이 날 기록 지우기</button>
          </div>
        </section>
      </main>

      <aside class="side">
        <!-- 태블릿/PC: 달력 오른쪽 세로 컬렉션 -->
        <section class="faces faces--side" aria-label="이번 달 내 얼굴 컬렉션">
          <h3>이번 달 내 얼굴 컬렉션</h3>
          <div class="face-list" data-face-list></div>
        </section>

        <section class="goals" id="goalSummary" aria-label="이번 달 목표"></section>
      </aside>
    </div>

    <footer class="brand">
      <span>SOCRA × Tess</span>
      <small>© SOCRA × Tess</small>
    </footer>
  </div>

  <!-- 목표 · 보상 설정 -->
  <dialog id="goalDialog" class="goal-dialog">
    <form id="goalForm">
      <h2>내 목표 정하기</h2>
      <p class="hint">비워 두면 그 목표는 쓰지 않아요. 얼굴 표정은 여기서 정한 목표를 기준으로 바뀌어요.</p>

      <label class="field">
        <span>하루 최대</span>
        <input type="number" inputmode="numeric" min="1" max="99" id="dailyMax" placeholder="2">
        <span class="suffix">잔·병 이하</span>
      </label>

      <label class="field">
        <span>한 달 금주</span>
        <input type="number" inputmode="numeric" min="1" max="31" id="soberTarget" placeholder="10">
        <span class="suffix">일</span>
      </label>

      <h3>보상</h3>
      <p class="hint">한 달 안에 금주 일수를 채우면 받을 보상이에요.</p>
      <div id="rewardRows" class="reward-rows"></div>
      <button type="button" class="add-reward" id="addReward">+ 보상 추가</button>

      <div class="dialog-actions">
        <button type="button" class="ghost" id="goalCancel">닫기</button>
        <button type="submit" class="save-btn">목표 저장</button>
      </div>
    </form>
  </dialog>

  <!-- 얼굴 리액션 / 저장 알림 -->
  <div class="face-pop" id="facePop" aria-hidden="true">
    <div class="face-pop-emoji" id="facePopEmoji"></div>
    <div class="face-pop-msg" id="facePopMsg"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
